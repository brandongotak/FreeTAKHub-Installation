---
- name: Ensure nodered group exists
  tags: nodered
  group:
    name: nodered
    state: present

- name: Ensure nodered user is in nodered group
  tags: nodered
  user:
    name: nodered
    group: nodered

- name: Restart NodeRed Unit
  tags: nodered
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    name: nodered

- name: Wait for NodeRed service to start
  tags: nodered
  uri:
    url: http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}
    status_code: 200
    timeout: 5
  register: nodered_service_status
  # Keep trying for 30 seconds in 5 sec intervals
  retries: 6
  delay: 5
  until: >
     'status' in nodered_service_status and
     nodered_service_status['status'] == 200

# the git module clones or updates in place, so reruns don't fail on an
# existing checkout the way a bare `git clone` did
- name: Clone or update Node-RED flow repositories
  tags: nodered
  git:
    repo: "https://github.com/FreeTAKTeam/{{ item }}.git"
    dest: "{{ playbook_dir }}/{{ item }}"
    force: true
    update: true
  loop:
    - FreeTAKHub_VideoChecker
    - FreeTAKHub_Forms_SALUTE
    - FreeTAKHub-Webmap

