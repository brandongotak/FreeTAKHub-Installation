- name: Authenticate to NodeRed Admin API
  tags: nodered
  uri:
    url: "http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}/auth/token"
    method: POST
    headers:
      Content-Type: application/json
    body:
      client_id: node-red-admin
      grant_type: password
      scope: "*"
      username: "{{ nodered_username }}"
      password: "{{ nodered_password }}"
    body_format: json
    status_code: 200
  register: get_nodered_auth_output

- name: Make available NodeRed Admin Token
  tags: nodered
  set_fact: nodered_admin_token="{{ get_nodered_auth_output.json.access_token }}"

- name: Import Node-RED flows
  tags: nodered
  block:
    - name: Wait until Node-RED import port is open
      wait_for:
        port: "{{ noderedserver_port }}"

#    - name: Import Node-RED flows via HTTP POST
#      uri:
#        url: "http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}/flows"
#        method: POST
#        headers:
#          Content-Type: application/json
#          Node-RED-API-Version: v1
#          Node-RED-Deployment-Type: full
#          Authorization: Bearer {{ nodered_admin_token }}
#        body: "{{ nodered_post_flows_body }}"
#        body_format: json
#        status_code: 204

#    - name: Import Node-RED SALUTE flow via HTTP POST
#      uri:
#        url: "http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}/flow"
#        method: POST
#        headers:
#          Content-Type: application/json
#          Node-RED-API-Version: v1
#          Node-RED-Deployment-Type: full
#          Authorization: Bearer {{ nodered_admin_token }}
#        body: "{{ nodered_post_flow_salute }}"
#        body_format: json
#        status_code: 200

    # The flow files have no flow id, so match existing flows by tab label:
    # PUT replaces a flow imported by an earlier run, POST adds a new one.
    # POSTing again fails with "duplicate id" because the node ids are fixed.
    - name: Get existing Node-RED flows
      uri:
        url: "http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}/flows"
        method: GET
        headers:
          Node-RED-API-Version: v1
          Authorization: Bearer {{ nodered_admin_token }}
        status_code: 200
      register: nodered_existing_flows

    - name: Map existing flow labels to ids
      set_fact:
        nodered_existing_tabs: "{{ nodered_existing_flows.json | selectattr('type', 'equalto', 'tab') | items2dict(key_name='label', value_name='id') }}"

    - name: Import FTH flows (add or replace)
      vars:
        flow_body: "{{ lookup('file', playbook_dir + '/' + item) | from_json }}"
        flow_id: "{{ nodered_existing_tabs.get(flow_body.label, '') }}"
      uri:
        url: "http://{{ noderedserver_ipv4 }}:{{ noderedserver_port }}/flow{{ ('/' + flow_id) if flow_id else '' }}"
        method: "{{ 'PUT' if flow_id else 'POST' }}"
        headers:
          Content-Type: application/json
          Node-RED-API-Version: v1
          Node-RED-Deployment-Type: full
          Authorization: Bearer {{ nodered_admin_token }}
        body: "{{ flow_body }}"
        body_format: json
        status_code: 200
      loop:
        - FreeTAKHub-Webmap/freetakhub_config.json
        - FreeTAKHub_VideoChecker/freetakhub_videochecker.json
        - FreeTAKHub_Forms_SALUTE/freetakhub_salute.json
        - FreeTAKHub-Webmap/freetakhub_webmap.json

