---
- name: wait for lock-frontend release
  tags: nodered
  shell: >
    while fuser /var/lib/dpkg/lock-frontend >
    /dev/null 2>&1;
    do sleep 3; done;
  changed_when: false

- name: Get installed Node.js version
  tags: nodered
  command: node --version
  register: nodered_node_version
  failed_when: false
  changed_when: false

- name: Remove distro Node.js older than {{ nodered_nodejs_major }}
  tags: nodered
  apt:
    name: "{{ nodered_distro_nodejs_packages }}"
    state: absent
    autoremove: true
  when:
    - nodered_node_version.rc == 0
    - (nodered_node_version.stdout | regex_replace('^v(\\d+).*$', '\\1') | int) < nodered_nodejs_major
  register: nodered_old_nodejs_removed

# Ubuntu's npm installs globals under /usr/local, NodeSource's under /usr; the
# old node-red in /usr/local/bin would otherwise shadow the new one on PATH
- name: Remove global npm packages left by the distro npm
  tags: nodered
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/node-red
    - /usr/local/bin/node-red-pi
    - /usr/local/bin/node-red-admin
    - /usr/local/lib/node_modules/node-red
    - /usr/local/lib/node_modules/node-red-admin
    - /usr/local/lib/node_modules/node-red-contrib-web-worldmap
  when: nodered_old_nodejs_removed is changed

- name: Create apt keyrings directory
  tags: nodered
  file:
    path: "{{ nodered_nodesource_key | dirname }}"
    state: directory
    mode: 0755

- name: Add NodeSource signing key
  tags: nodered
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: "{{ nodered_nodesource_key }}"
    mode: 0644

- name: "Add NodeSource Node.js {{ nodered_nodejs_major }} repository"
  tags: nodered
  apt_repository:
    repo: "deb [signed-by={{ nodered_nodesource_key }}] https://deb.nodesource.com/node_{{ nodered_nodejs_major }}.x nodistro main"
    filename: nodesource
    update_cache: true

- name: Install apt dependencies
  tags: nodered
  apt:
    name: "{{ item }}"
  loop: "{{ nodered_apt_dependencies | list }}"

- name: Install packages with npm
  tags: nodered
  npm:
    name: "{{ item }}"
    global: true
    unsafe_perm: true
  loop: "{{ nodered_npm_packages | list }}"

- name: Install Node-RED nodes with npm
  tags: nodered
  npm:
    name: "{{ item }}"
    path: "{{ nodered_install_folder }}"
  loop: "{{ nodered_nodes | list }}"

# nodes installed under the old Node.js may include native addons
- name: Rebuild Node-RED nodes for the new Node.js
  tags: nodered
  command: npm rebuild
  args:
    chdir: "{{ nodered_install_folder }}"
  when: nodered_old_nodejs_removed is changed

- name: Create flows directory
  tags: nodered
  file:
    path: "{{ nodered_install_folder }}/lib/flows"
    state: directory
    mode: 0755

- name: Template unit file
  tags: nodered
  template:
    src: nodered.service.j2
    dest: "{{ unit_files_location }}/{{ nodered_service_name }}.service"
    owner: root
    group: root
    mode: 0644


- name: Enable service
  tags: nodered
  service:
    name: "{{ nodered_service_name }}"
    enabled: true
    use: systemd
  register: enable_nodered_state
  retries: 20
  until: enable_nodered_state is success

- name: Template settings file
  tags: nodered
  template:
    src: settings.js.j2
    dest: "{{ nodered_install_folder }}/{{ nodered_settings_file }}"
    owner: root
    group: root
    mode: 0644

- name: Set service state
  tags: nodered
  service:
    name: "{{ nodered_service_name }}"
    state: restarted
    use: systemd
  register: set_nodered_state
  retries: 20
  until:
    - set_nodered_state is success
    - set_nodered_state.status.ActiveState == "active"

- name: "Template backup Node-RED flows"
  tags: nodered
  template:
    src: "{{ item }}.j2"
    dest: "{{ nodered_install_folder }}/lib/flows/{{ item }}"
    owner: root
    group: root
    mode: 0644
  loop: "{{ nodered_flows }}"

- name: "Template flows.json to /tmp/flows.json"
  tags: nodered
  template:
    src: "flows.json.j2"
    dest: "/tmp/flows.json"
    owner: root
    group: root
    mode: 0644
