---
videoserver_ipv4: 0.0.0.0

# MediaMTX (formerly rtsp-simple-server)
videoserver_version: v1.21.2
videoserver_executable: mediamtx
videoserver_config_file: mediamtx.yml
videoserver_service_name: mediamtx

# ansible_architecture -> MediaMTX release asset suffix
videoserver_architectures:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6

videoserver_architecture: "{{ videoserver_architectures[ansible_architecture] }}"
videoserver_package_name: "mediamtx_{{ videoserver_version }}_linux_{{ videoserver_architecture }}.tar.gz"
videoserver_download_url: "https://github.com/bluenviron/mediamtx/releases/download/{{ videoserver_version }}/{{ videoserver_package_name }}"

# Only Node-RED's VideoChecker flow on this host uses the control API
videoserver_api_address: 127.0.0.1:9997

# The previous video server, removed when found
videoserver_legacy_service_name: rtsp-simple-server

videoserver_state: started

videoserver_enabled: true
