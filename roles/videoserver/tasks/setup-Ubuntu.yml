---
- name: "Stop legacy {{ videoserver_legacy_service_name }} service"
  service:
    name: "{{ videoserver_legacy_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: "Remove legacy {{ videoserver_legacy_service_name }} files"
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ unit_files_location }}/{{ videoserver_legacy_service_name }}.service"
    - "/usr/local/bin/{{ videoserver_legacy_service_name }}"
    - "/opt/{{ videoserver_legacy_service_name }}.yml"

- name: Create unpack directory
  file:
    path: "{{ videoserver_unpack_location }}"
    state: directory
    mode: 0755

- name: "Download and unarchive {{ videoserver_package_name }}"
  unarchive:
    src: "{{ videoserver_download_url }}"
    dest: "{{ videoserver_unpack_location }}"
    remote_src: true
    owner: root
    group: root

- name: "Copy {{ videoserver_executable }} to {{ videoserver_executable_location }}"
  copy:
    src: "{{ videoserver_unpack_location }}/{{ videoserver_executable }}"
    dest: "{{ videoserver_executable_location }}"
    owner: root
    group: root
    mode: 0755
    remote_src: true
