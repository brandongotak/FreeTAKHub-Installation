---
# The fts-enrollment unit is always installed but only starts once
# FreeTAKServer.core.util.enrollment_setup has written its environment file,
# either from --domain below or from the UI's configure page.
- name: Install certbot
  apt:
    name: certbot

- name: Create certbot deploy hook directory
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: 0755

- name: Restart enrollment service when the certificate renews
  copy:
    dest: "/etc/letsencrypt/renewal-hooks/deploy/{{ fts_enrollment_service_name }}.sh"
    content: |
      #!/bin/sh
      systemctl restart {{ fts_enrollment_service_name }}
    owner: root
    group: root
    mode: 0755

# systemd opens StandardOutput=append: files before LogsDirectory= would
# create them, so the log directory has to exist already
- name: Create log directory
  file:
    path: "/var/log/{{ fts_enrollment_service_name }}"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Template enrollment unit file
  template:
    src: fts-enrollment.service.j2
    dest: "{{ unit_files_location }}/{{ fts_enrollment_service_name }}.service"
    owner: root
    group: root
    mode: 0644

- name: Enable enrollment service
  systemd:
    name: "{{ fts_enrollment_service_name }}"
    enabled: true
    daemon_reload: true

# standalone mode answers the HTTP-01 challenge itself, so port 80 must be
# reachable from the internet; renewals reuse the same settings
- name: "Set up certificate enrollment for {{ fts_enrollment_domain }}"
  command:
    argv: "{{ [fts_venv + '/bin/python3', '-m', 'FreeTAKServer.core.util.enrollment_setup',
               '--domain', fts_enrollment_domain, '--port', fts_enrollment_port | string]
             + (['--email', fts_enrollment_email] if fts_enrollment_email else []) }}"
    chdir: "{{ fts_data_path }}"
  environment:
    FTS_PERSISTENCE_PATH: "{{ fts_data_path }}"
    FTS_CONFIG_PATH: "{{ fts_config_path }}"
  when: fts_enrollment_domain | length > 0

# a unit whose start condition failed shows as inactive; restart it on reruns
# so an existing configuration picks up the reinstalled FTS code
- name: Restart enrollment service if already configured
  systemd:
    name: "{{ fts_enrollment_service_name }}"
    state: restarted
  when: fts_enrollment_domain | length == 0 and fts_enrollment_env_file is exists
