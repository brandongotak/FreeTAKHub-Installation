---
# System
fts_connection_message: Connected
fts_database_type: SQLite
fts_optimize_api: true
fts_mainloop_delay: 1

# Addresses
fts_cot_port: 8087
fts_sslcot_port: 8089
fts_ui_port: 5000
fts_webmap_port: 1880
fts_api_port: 19023
fts_fed_port: 9000

# FileSystem
fts_cot_to_db: true

# Certs
# Generated on the first run and stored on the server (the playbook runs
# locally), then reused on every rerun so existing certificates keep working.
# The client cert password must not change once certs exist, or ATAK reports
# an invalid truststore.
fts_secrets_path: /etc/freetakhub/secrets
fts_federation_keypass: "{{ lookup('password', fts_secrets_path + '/fts_federation_keypass chars=ascii_letters,digits length=24') }}"
fts_client_cert_password: "{{ lookup('password', fts_secrets_path + '/fts_client_cert_password chars=ascii_letters,digits length=24') }}"
fts_websocket_key: "{{ lookup('password', fts_secrets_path + '/fts_websocket_key chars=ascii_letters,digits length=32') }}"
