---
# system information
fts_ipv4: 0.0.0.0

fts_pip_package_name: FreeTAKServer

# pip requirement spec used to install FTS. The PyPI release (2.2.1) no longer
# starts with current dependencies, so install the patched fork instead.
# Override with e.g. `fts_pip_spec="FreeTAKServer==2.2.1"` to use PyPI.
fts_pip_spec: "git+https://github.com/brandongotak/FreeTakServer.git@master"

fts_service_name: fts

# Set initial service state. Recommended values: `started` or `stopped`.
fts_state: started

# Enable service. Recommended values: `true` or `false`
fts_enabled: true

cfg_rpath: "core/configuration"

# Username/password certificate enrollment on fts_enrollment_port, served with
# a Let's Encrypt certificate for this domain. Empty disables it.
fts_enrollment_domain: ""
# optional email for Let's Encrypt expiry notices
fts_enrollment_email: ""
fts_enrollment_port: 8446
fts_enrollment_service_name: fts-enrollment
