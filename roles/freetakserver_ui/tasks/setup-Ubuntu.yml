---
- name: Delete PyYAML
  shell: "{{ item }}"
  loop:
    - "rm -rf {{ fts_venv }}/lib/python3.11/site-packages/yaml"
    - "rm -rf {{ fts_venv }}/lib/python3.11/site-packages/PyYAML-*"

- name: Install apt packages
  apt:
    name: "{{ fts_ui_apt_packages }}"

- name: "Install pip packages"
  pip:
    name: "{{ fts_ui_pip_packages }}"
    virtualenv: "{{ fts_venv }}"

- name: "Install {{ fts_ui_pip_package_name }}"
  pip:
    name: "{{ fts_ui_pip_spec }}"
    virtualenv: "{{ fts_venv }}"

# pip skips a git install whose version number hasn't changed, so force the
# UI package itself to be rebuilt so re-running the installer picks up updates
- name: "Reinstall {{ fts_ui_pip_package_name }} code"
  pip:
    name: "{{ fts_ui_pip_spec }}"
    virtualenv: "{{ fts_venv }}"
    extra_args: "--force-reinstall --no-deps"
  when: fts_ui_pip_spec is search('^git\\+')
