---
# system information
fts_ui_ipv4: 0.0.0.0

# FreeTAKServer-UI pip package name
fts_ui_pip_package_name: FreeTAKServer-UI

# pip requirement spec used to install the UI: the fork's fts-fork branch
# (3.0.0; the last PyPI release is 2.2.1). Override with
# "FreeTAKServer-UI==2.2.1" to use PyPI.
# updates follow fts_ui_git_branch; easy_install.sh --ui-ref overrides the
# ref with a commit (used by fts-update --rollback)
fts_ui_git_repo: "https://github.com/brandongotak/UI.git"
fts_ui_git_branch: fts-fork
fts_ui_git_ref: "{{ fts_ui_git_branch }}"
fts_ui_pip_spec: "git+{{ fts_ui_git_repo }}@{{ fts_ui_git_ref }}"

# Flask secret for the UI's session cookie; generated once and reused on
# reruns so updates don't sign everyone out
fts_ui_secret_key: "{{ lookup('password', fts_secrets_path + '/fts_ui_secret_key chars=ascii_letters,digits length=48') }}"

# system service name
fts_ui_service_name: fts-ui

# Set initial service state. Recommended values: `started` or `stopped`.
fts_ui_state: started

# Enable service.
fts_ui_enabled: true
